name: Set Kredensial Unity (jalankan sekali)

# ============================================================================
#  Menyimpan UNITY_EMAIL & UNITY_PASSWORD sebagai secret repo, langsung dari
#  browser GitHub — tanpa perlu mengetik apa pun di halaman Settings.
#
#  Cara pakai:
#   1. Tab Actions > "Set Kredensial Unity" > Run workflow
#   2. Isi email & password akun Unity kamu (pakai akun khusus CI lebih aman)
#   3. Jalankan workflow build.
#
#  Catatan keamanan:
#   - Password dienkripsi memakai public key repo (libsodium sealed box),
#     lalu disimpan sebagai secret GitHub. Tidak ditampilkan di log.
#   - Kalau akun Unity pakai 2FA, matikan dulu (CI tidak bisa menjawab OTP).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      unity_email:
        description: "Email akun Unity"
        required: true
      unity_password:
        description: "Password akun Unity (disimpan sebagai secret terenkripsi)"
        required: true

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Simpan UNITY_EMAIL & UNITY_PASSWORD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          U_EMAIL: ${{ inputs.unity_email }}
          U_PASS: ${{ inputs.unity_password }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          KEY_JSON=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/secrets/public-key")

          python3 - "$KEY_JSON" "$U_EMAIL" "$U_PASS" "$REPO" <<'PY'
          import base64, json, os, sys, urllib.request
          from nacl import encoding, public

          key_json, email, password, repo = sys.argv[1:5]
          k = json.loads(key_json)
          pub = public.PublicKey(k["key"].encode(), encoding.Base64Encoder())
          box = public.SealedBox(pub)

          def put(name, value):
              enc = base64.b64encode(box.encrypt(value.encode())).decode()
              body = json.dumps({"encrypted_value": enc, "key_id": k["key_id"]}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  data=body, method="PUT",
                  headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  print(f"{name} tersimpan (http {r.status})")

          put("UNITY_EMAIL", email.strip())
          put("UNITY_PASSWORD", password)
          PY
